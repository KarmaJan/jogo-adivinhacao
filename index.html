<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="description" content="Jogo de adivinhação de números desenvolvido com HTML, CSS e JavaScript.">

<title>Jogo de Adivinhação</title>

<link rel="stylesheet" href="style.css">

<script src="script.js" defer></script>


</head>

<body>


<main class="container">

    <section class="jogo">

        <h1>🎯 Jogo de Adivinhação</h1>

        <p class="mensagem-inicial">
            Estou pensando em um número entre 1 e 100.
            Você consegue adivinhar?
        </p>

        <form id="formulario-jogo">

            <label for="palpite">Digite seu palpite:</label>

            <input
                type="number"
                id="palpite"
                min="1"
                max="100"
                placeholder="Digite um numero"
                required
            >

            <button type="submit" id="botao-chutar">
                Chutar
            </button>

        </form>

        <p id="mensagem" aria-live="polite">
            Boa sorte!
        </p>

        <p id="tentativas">
            Tentativas restantes: 10
        </p>

        <button type="button" id="botao-reiniciar" hidden>
            Jogar novamente
        </button>

    </section>

</main>


</body>

</html>
